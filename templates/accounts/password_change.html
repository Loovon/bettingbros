{% extends "base/base.html" %}
{% block title %}Change Password — BetPlatform{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-card__title">Change Password</h1>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="form-group">
          <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          <input type="password" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
                 class="form-input" autocomplete="{{ field.html_name }}" />
          {% if field.errors %}<p class="form-error">{{ field.errors|join:" " }}</p>{% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn--primary" style="width:100%; padding:var(--s4);">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
