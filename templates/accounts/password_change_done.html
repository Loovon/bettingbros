{% extends "base/base.html" %}
{% block title %}Password Changed — BetPlatform{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card" style="text-align:center;">
    <div style="font-size:3rem; margin-bottom:var(--s4);">✅</div>
    <h1 class="auth-card__title">Password Updated</h1>
    <p style="color:var(--text-muted); margin-bottom:var(--s6);">Your password has been changed successfully.</p>
    <a href="{% url 'accounts:profile' %}" class="btn btn--primary">Back to Profile</a>
  </div>
</div>
{% endblock %}
